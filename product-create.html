<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jual Barang | KampusMart</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .modern-icon {
            width: 17px;
            height: 17px;
            vertical-align: middle;
            margin-right: 5px;
        }
    </style>
</head>
<body>

<header class="top">
    <a class="brand" href="index.html">Kampus<span>Mart</span></a>
    <nav>
        <a href="index.html">Beranda</a>
        <a href="my-products.html">Barang Saya</a>
    </nav>
</header>

<main class="form-page">
    <a href="my-products.html">← Kembali</a>

    <h1>Jual barangmu</h1>
    <p class="muted">Berikan informasi yang jelas kepada calon pembeli.</p>

    <div class="panel wide">
        <div id="message"></div>

        <form id="productForm" class="fields">

            <label>Nama barang
                <input
                    type="text"
                    id="title"
                    maxlength="150"
                    minlength="3"
                    required
                >
            </label>

            <div class="two">
                <label>Harga (Rp)
                    <input
                        type="text"
                        id="price"
                        name="price"
                        placeholder="Contoh: 1.200.000"
                        inputmode="numeric"
                        required
                    >
                </label>

                <label>Kategori
                    <select id="category" required>
                        <option value="Buku">Buku</option>
                        <option value="Elektronik">Elektronik</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Perlengkapan Kos">Perlengkapan Kos</option>
                        <option value="Alat Tulis">Alat Tulis</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </label>
            </div>

            <label>Kondisi barang
                <select id="condition" required>
                    <option value="Baru">Baru</option>
                    <option value="Seperti Baru">Seperti Baru</option>
                    <option value="Baik">Baik</option>
                    <option value="Cukup">Cukup</option>
                </select>
            </label>

            <label>Deskripsi
                <textarea
                    id="description"
                    minlength="10"
                    maxlength="5000"
                    rows="5"
                    required
                ></textarea>
            </label>

            <label>Foto barang (opsional)
                <input
                    type="file"
                    id="photo"
                    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                >
                <small>JPG, PNG, atau WEBP. Maksimal 3 MB.</small>
            </label>

            <button class="btn" id="submitBtn" type="submit">
                Publikasikan Barang <i data-lucide="arrow-right" class="modern-icon"></i>
            </button>
        </form>
    </div>
</main>

<script>
const form = document.getElementById('productForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

/* FORMAT HARGA OTOMATIS */
const hargaInput = document.getElementById('price');

hargaInput.addEventListener('input', function () {
    const angka = this.value.replace(/\D/g, '');

    this.value = angka
        ? Number(angka).toLocaleString('id-ID')
        : '';
});

function showMessage(text, success = false) {
    message.innerHTML = '';
    const box = document.createElement('div');
    box.className = success ? 'success' : 'error';
    box.textContent = text;
    message.appendChild(box);
}

async function checkLogin() {
    const { data, error } = await window.db.auth.getUser();

    if (error || !data.user) {
        alert('Silakan login terlebih dahulu.');
        window.location.href = 'login.html';
        return null;
    }

    return data.user;
}

form.addEventListener('submit', async function(e) {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = 'Memproses...';

    let uploadedPath = null;

    try {
        const user = await checkLogin();
        if (!user) return;

        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();

        /* HAPUS TITIK SEBELUM MENYIMPAN HARGA */
        const price = Number(
            document.getElementById('price').value.replace(/\./g, '')
        );

        const category = document.getElementById('category').value;
        const condition = document.getElementById('condition').value;
        const photoFile = document.getElementById('photo').files[0];

        const categories = [
            'Buku', 'Elektronik', 'Fashion',
            'Perlengkapan Kos', 'Alat Tulis', 'Lainnya'
        ];

        const conditions = [
            'Baru', 'Seperti Baru', 'Baik', 'Cukup'
        ];

        if (title.length < 3 || title.length > 150) {
            throw new Error('Nama barang harus 3–150 karakter.');
        }

        if (description.length < 10 || description.length > 5000) {
            throw new Error('Deskripsi harus 10–5000 karakter.');
        }

        if (!Number.isFinite(price) || price < 0 || price > 999999999999) {
            throw new Error('Harga tidak valid.');
        }

        if (!categories.includes(category) || !conditions.includes(condition)) {
            throw new Error('Kategori atau kondisi tidak valid.');
        }

        let photo = null;

        if (photoFile) {
            if (photoFile.size > 3 * 1024 * 1024) {
                throw new Error('Ukuran foto maksimal 3 MB.');
            }

            const allowedTypes = [
                'image/jpeg',
                'image/png',
                'image/webp'
            ];

            if (!allowedTypes.includes(photoFile.type)) {
                throw new Error('Foto harus JPG, PNG, atau WEBP.');
            }

            const extension = {
                'image/jpeg': 'jpg',
                'image/png': 'png',
                'image/webp': 'webp'
            }[photoFile.type];

            const filePath =
                user.id + '/' + crypto.randomUUID() + '.' + extension;

            const { error: uploadError } = await
