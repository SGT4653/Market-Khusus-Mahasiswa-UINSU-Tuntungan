<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | KampusMart</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .modern-icon {
            width: 17px;
            height: 17px;
            vertical-align: middle;
            margin-right: 5px;
        }

        .auth-icon {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin-right: 6px;
            color: #16834a;
        }
    </style>
</head>
<body>

<header class="top">
    <a class="brand" href="index.html">
        Kampus<span>Mart</span>
    </a>
    <a href="index.html">
        <i data-lucide="house" class="modern-icon"></i>
        Beranda
    </a>
</header>

<main class="auth">
    <div class="panel">
        <p class="kicker">SELAMAT DATANG KEMBALI</p>
        <h1>Login akun</h1>

        <form id="loginForm" class="fields">
            <label>
                <i data-lucide="mail" class="auth-icon"></i>
                Email
                <input type="email" id="email"
                    placeholder="Masukkan email" required>
            </label>

            <label>
                <i data-lucide="lock" class="auth-icon"></i>
                Password
                <input type="password" id="password"
                    placeholder="Masukkan password" required>
            </label>

            <button class="btn" type="submit">
                <i data-lucide="log-in" class="modern-icon"></i>
                Login
            </button>

            <p id="message"></p>
        </form>

        <p>Belum punya akun?
            <a href="register.html">Daftar gratis</a>
        </p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
console.log("Supabase:", typeof window.supabase);
console.log("Database:", typeof window.db);
</script>
    
<script>
const form = document.getElementById('loginForm');
const message = document.getElementById('message');

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    message.textContent = 'Sedang login...';

    try {
        const { data, error } = await window.db.auth.signInWithPassword({
    email: email,
    password: password
    });

        if (error) throw error;

        message.textContent = 'Login berhasil!';

        window.location.href = 'index.html';

    } catch (error) {
        message.textContent = 'Login gagal: ' + error.message;
    }
});

lucide.createIcons();
</script>

</body>
</html>
