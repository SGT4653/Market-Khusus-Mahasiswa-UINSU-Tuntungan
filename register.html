<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar | KampusMart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
    <a class="brand" href="index.html">
        Kampus<span>Mart</span>
    </a>
    <a href="index.html">Beranda</a>
</header>

<main class="auth">
    <div class="panel">
        <p class="kicker">KOMUNITAS MAHASISWA UINSU</p>
        <h1>Buat akun</h1>
        <p class="muted">Mulai jual dan cari barang kebutuhanmu.</p>

        <form id="registerForm" class="fields">

            <label>Nama lengkap
                <input type="text" id="name"
                    maxlength="100" required>
            </label>

            <label>Email
                <input type="email" id="email" required>
            </label>

            <label>Nomor WhatsApp
                <input type="tel" id="phone"
                    placeholder="08xxxxxxxxxx" required>
            </label>

            <label>Password
                <input type="password" id="password"
                    minlength="8" required>
            </label>

            <label>Ulangi password
                <input type="password" id="confirmPassword"
                    minlength="8" required>
            </label>

            <button class="btn" id="registerButton" type="submit">
                Daftar gratis →
            </button>

            <p id="message" role="status"></p>
        </form>

        <p>Sudah punya akun?
            <a href="login.html">Login</a>
        </p>

        <small>Versi awal belum memverifikasi status mahasiswa UINSU.</small>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2"></script>
    
<script>
const form = document.getElementById('registerForm');
const message = document.getElementById('message');
const button = document.getElementById('registerButton');

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!window.db) {
        message.textContent = 'Koneksi Supabase belum tersedia. Periksa supabase.js.';
        return;
    }

    if (name.length < 2 || name.length > 100) {
        message.textContent = 'Nama harus terdiri dari 2–100 karakter.';
        return;
    }

    if (phone.replace(/\D/g, '').length < 9) {
        message.textContent = 'Nomor WhatsApp tidak valid.';
        return;
    }

    if (password.length < 8) {
        message.textContent = 'Password minimal 8 karakter.';
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = 'Konfirmasi password tidak cocok.';
        return;
    }

    button.disabled = true;
    message.textContent = 'Sedang membuat akun...';

    try {
        const { data, error } = await window.db.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    name: name,
                    phone: phone
                }
            }
        });

        if (error) throw error;

        if (!data.user) {
            throw new Error('Akun belum berhasil dibuat.');
        }

        if (data.session) {
            message.textContent =
                'Pendaftaran berhasil! Mengalihkan ke halaman utama...';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);

        } else {
            message.textContent =
                'Pendaftaran berhasil! Silakan periksa email untuk verifikasi sebelum login.';

            form.reset();
            button.disabled = false;
        }

    } catch (error) {
        message.textContent = 'Pendaftaran gagal: ' + error.message;
        button.disabled = false;
    }
});
</script>

</body>
</html>
